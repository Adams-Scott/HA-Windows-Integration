name: Agent

on:
  push:
    branches: ["**"]
    paths: ["agent/**", ".github/workflows/agent.yml"]
  release:
    types: [published]
  pull_request:
    paths: ["agent/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Test
        run: dotnet test agent/PcControl.Agent.slnx -c Release

      - name: Publish
        run: dotnet publish agent/PcControl.Agent -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -o publish

      - uses: actions/upload-artifact@v4
        with:
          name: PcControl.Agent
          path: publish/PcControl.Agent.exe

      - name: Attach to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: publish/PcControl.Agent.exe
